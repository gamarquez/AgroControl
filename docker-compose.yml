services:
  postgres:
    image: postgres:17-alpine
    container_name: agrocontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocontrol}
      POSTGRES_USER: ${POSTGRES_USER:-agrocontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocontrol_dev_password}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-agrocontrol} -d ${POSTGRES_DB:-agrocontrol}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
