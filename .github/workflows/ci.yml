name: ci

on:
  push:
    branches:
      - main
      - develop
      - codex/**
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Validate repository
        shell: pwsh
        run: ./scripts/ci/validate-bootstrap.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: ./scripts/ci/run-dotnet.ps1 restore
      - name: Build
        shell: pwsh
        run: ./scripts/ci/run-dotnet.ps1 build
      - name: Test
        shell: pwsh
        run: ./scripts/ci/run-dotnet.ps1 test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        shell: pwsh
        run: ./scripts/ci/run-web.ps1 lint
      - name: Test
        shell: pwsh
        run: ./scripts/ci/run-web.ps1 test
      - name: Build
        shell: pwsh
        run: ./scripts/ci/run-web.ps1 build
