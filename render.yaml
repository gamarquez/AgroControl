services:
  - type: web
    name: agrocontrol-api
    runtime: docker
    rootDir: .
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: POSTGRES_CONNECTION_STRING
        sync: false
      - key: Auth__SigningKey
        generateValue: true
      - key: Auth__Issuer
        fromService:
          type: web
          name: agrocontrol-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: Auth__Audience
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: AllowedHosts
        fromService:
          type: web
          name: agrocontrol-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
