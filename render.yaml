services:
  - type: web
    name: agrocontrol-api
    runtime: dotnet
    rootDir: .
    branch: main
    buildCommand: pwsh -File ./scripts/deploy/render-build.ps1
    startCommand: dotnet ./out/AgroControl.Api.dll
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: POSTGRES_CONNECTION_STRING
        sync: false
      - key: Auth__SigningKey
        sync: false
      - key: Auth__Issuer
        sync: false
      - key: Auth__Audience
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: AllowedHosts
        sync: false
